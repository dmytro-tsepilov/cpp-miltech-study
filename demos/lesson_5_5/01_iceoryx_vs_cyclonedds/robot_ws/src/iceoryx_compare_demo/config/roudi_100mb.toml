# Пули пам'яті RouDi для demo 5.5 з великими payload.
#
# Важливо: 100 MB chunks потребують достатнього /dev/shm.
# Mempool size має невеликий запас над 1/10/100 MiB payload.
# Перевірка перед запуском:
#   df -h /dev/shm
[general]
version = 1

[[segment]]

# Малі пули потрібні для discovery, rosout, parameter events та інших
# службових ROS 2 семплів. Без них семпл на десятки байтів займає chunk
# з першого великого пулу і швидко вичерпує його.
[[segment.mempool]]
size = 128
count = 10000

[[segment.mempool]]
size = 1024
count = 5000

[[segment.mempool]]
size = 16384
count = 1000

[[segment.mempool]]
size = 131072
count = 200

[[segment.mempool]]
size = 524288
count = 50

# Для кожного payload лишається запас на loaned sample, publisher history
# KeepLast(4) і coordination між publisher та subscriber.
[[segment.mempool]]
size = 1052672
count = 8

[[segment.mempool]]
size = 10489856
count = 8

[[segment.mempool]]
size = 104861696
count = 8
